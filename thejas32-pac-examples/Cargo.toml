[dependencies]
# `critical-section` enables `Peripherals::take()`, the singleton accessor.
# Without it svd2rust compiles `take()` out entirely and only `steal()` remains,
# which is why every example used to steal its peripherals.
thejas32-pac = { path = "../thejas32-pac", features = ["rt", "critical-section"] }
thejas32-hal = { path = "../thejas32-hal" }
riscv-rt = { version = "0.13.0", features = ["single-hart"] }
panic-halt = "1.0.0"
embedded-hal = "1.0.0"
embedded-hal-nb = "1.0.0"
nb = "1.1.0"
riscv = "0.12.1"
critical-section = "1.2.0"
embedded-hal-async = "1.0.0"
